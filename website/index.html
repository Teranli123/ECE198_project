<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rehab Session Overview</title>
<style>
  :root {
    --bg: #f3f5f7; --card: #ffffff; --text: #17202a; --muted: #5d6b7a; --line: #e1e6eb;
    --accent: #2563eb; --accent-soft: #e0e9fd;
    --low: #16a34a; --mid: #2563eb; --high: #dc2626; --high-bg: #fde2e2; --off: #9aa5b1;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f141a; --card: #18202a; --text: #e8edf2; --muted: #93a1b0; --line: #2a3541;
      --accent: #5b8def; --accent-soft: #1e2c47;
      --low: #22c55e; --mid: #5b8def; --high: #f05252; --high-bg: #4a1d1f; --off: #5d6b7a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

  header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between;
    padding: 14px 24px; background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  header h1 { margin: 0; font-size: 20px; }
  .stats { display: flex; gap: 16px; color: var(--muted); font-size: 14px; flex-wrap: wrap; }
  .stats b { color: var(--text); }
  .stats .alert b { color: var(--high); }

  .controls { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; }
  .controls .label { font-size: 13px; color: var(--muted); font-weight: 600; }
  .seg { display: inline-flex; gap: 4px; background: var(--bg); padding: 4px; border-radius: 12px; }
  .seg button { font: inherit; font-weight: 600; border: none; background: transparent; color: var(--text);
    padding: 8px 16px; border-radius: 9px; cursor: pointer; }
  .seg.small button { padding: 8px 12px; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .seg button:hover:not([aria-pressed="true"]) { background: var(--accent-soft); }
  .btn { font: inherit; font-weight: 600; padding: 9px 14px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--text); display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { border-color: var(--accent); }

  main { padding: 18px 24px 28px; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }

  .tile { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 14px 12px; overflow: hidden; transition: background .3s, border-color .3s, opacity .3s; }
  .tile::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--zc, var(--off)); }
  .tile .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; }
  .tile .who { min-width: 0; }
  .tile .name { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .tile .ex { font-size: 12px; color: var(--muted); }
  .edit { flex: none; border: none; background: transparent; color: var(--muted); cursor: pointer; padding: 4px; border-radius: 6px; line-height: 0; }
  .edit:hover { background: var(--bg); color: var(--text); }
  .hr { display: flex; align-items: baseline; gap: 6px; margin: 4px 0 2px; }
  .hr .heart { color: var(--zc, var(--off)); font-size: 18px; }
  .hr b { font-size: 34px; line-height: 1.05; font-variant-numeric: tabular-nums; color: var(--zc, var(--text)); }
  .hr span { color: var(--muted); font-size: 13px; }
  .meter { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; background: var(--zc, var(--off)); border-radius: 3px; transition: width .5s, background .3s; }
  .foot { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: 8px; font-size: 13px; color: var(--muted); }
  .foot .reps b { color: var(--text); font-size: 16px; font-variant-numeric: tabular-nums; }
  .weight { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px;
    background: var(--accent-soft); color: var(--text); font-weight: 700; font-size: 12px; white-space: nowrap; }
  .weight.bw { background: var(--bg); color: var(--muted); font-weight: 600; }
  .weight svg { flex: none; }

  /* Heart rate too high: red tile that shakes */
  .tile.high { background: var(--high-bg); border-color: var(--high); animation: shake 2s infinite; }
  .tile.high .hr b { color: var(--high); }
  @keyframes shake {
    0%, 30%, 100% { transform: translateX(0); }
    3%, 9%, 15%, 21% { transform: translateX(-4px) rotate(-.6deg); }
    6%, 12%, 18%, 24% { transform: translateX(4px) rotate(.6deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .tile.high { animation: none; box-shadow: 0 0 0 3px var(--high); }
  }
  /* Stopped transmitting: greyed out */
  .tile.offline { opacity: .45; filter: grayscale(1); }
  .tile .status { display: none; font-size: 12px; font-weight: 700; }
  .tile.offline .status, .tile.high .status { display: inline; }
  .tile.offline .status { color: var(--muted); }
  .tile.high .status { color: var(--high); }
  .tile.offline .weight, .tile.high .weight { display: none; }

  dialog { border: 1px solid var(--line); border-radius: 16px; padding: 20px; background: var(--card); color: var(--text); width: min(360px, 92vw); }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog h2 { margin: 0 0 14px; font-size: 18px; }
  dialog label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  dialog input { display: block; width: 100%; margin-top: 4px; font: inherit; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  dialog .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  dialog .hint { font-size: 12px; color: var(--muted); margin: -6px 0 14px; }
  dialog .btns { display: flex; justify-content: flex-end; gap: 8px; }
  dialog button { font: inherit; font-weight: 600; padding: 8px 14px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--text); }
  dialog button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(80px); background: var(--text); color: var(--card);
    padding: 10px 16px; border-radius: 10px; font-weight: 600; font-size: 14px; opacity: 0; transition: transform .25s, opacity .25s; pointer-events: none; }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  .demo-note { color: var(--muted); font-size: 12px; margin-top: 16px; }
  .empty { grid-column: 1 / -1; color: var(--muted); text-align: center; padding: 60px 16px; margin: 0; }

  @media (max-width: 600px) {
    header, main { padding-left: 16px; padding-right: 16px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .hr b { font-size: 28px; }
    .foot { flex-wrap: wrap; }
  }
</style>
<script src="vendor/exceljs.min.js"></script>
</head>
<body>
<header>
  <div>
    <h1>Rehab Session</h1>
    <div class="stats">
      <span><b id="sTotal">0</b> patients</span>
      <span class="alert"><b id="sHigh">0</b> high heart rate</span>
      <span><b id="sOff">0</b> no signal</span>
    </div>
  </div>
  <div class="controls">
    <span class="label">Exercise for everyone</span>
    <div class="seg" id="exerciseSeg" role="group" aria-label="Exercise for everyone"></div>
    <div class="seg small" id="unitSeg" role="group" aria-label="Weight unit">
      <button data-u="lb">lb</button><button data-u="kg">kg</button>
    </div>
    <button class="btn" id="btnExport" title="Download this session as an Excel file">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
      Export to Excel
    </button>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="demo-note" id="demoNote">Showing demo data. Run server/pt_server.py and open http://localhost:8000 for live devices.</div>
</main>

<dialog id="editDlg">
  <form method="dialog" id="editForm">
    <h2>Edit patient</h2>
    <label>Name <input id="fName" required maxlength="40"></label>
    <label>Age <input id="fAge" type="number" min="5" max="110" required></label>
    <p class="hint">Age sets the heart rate limits (max = 220 − age).</p>
    <div class="pair">
      <label>Squat weight (<span class="uName">lb</span>) <input id="fW0" type="number" min="0" max="1000" step="0.5" required></label>
      <label>Curl weight (<span class="uName">lb</span>) <input id="fW1" type="number" min="0" max="1000" step="0.5" required></label>
    </div>
    <p class="hint">Enter 0 for a body weight exercise.</p>
    <div class="btns">
      <button type="button" id="fCancel">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>

<script>
/* ---------------------------------------------------------------------
   Settings
   --------------------------------------------------------------------- */
const EXERCISES = ['Squats', 'Bicep curls'];   // index = exercise_mode on the Arduino
const CONFIG = {
  NO_SIGNAL_MS: 3000,    // grey a tile out after this long with no data
  SET_REST_MS: 20000,    // a set ends after this long with no new reps (or when the exercise changes)
};
// Heart rate zones match set_LED_color() in heart_rate_monitor.ino:
// below 40% of max = green, 40-60% = blue, above 60% = red (tile turns red and shakes).
const ZONE_MID = 0.4, ZONE_HIGH = 0.6;
const LB_PER_KG = 2.20462;

/* ---------------------------------------------------------------------
   Patients and incoming data
   Live mode (page opened from server/pt_server.py): the page polls
   /api/state twice a second and each ESP32 shows up as a tile.
   Demo mode (page opened as a file, or with ?demo in the URL): fake patients.
   --------------------------------------------------------------------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('ptaid.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('ptaid.' + k, JSON.stringify(v)); } catch {} }
};

// Weights are kept as { v: number, u: 'lb' | 'kg' } so a value never drifts from converting back and forth.
const toUnit = (w, u) => w.u === u ? w.v : (u === 'lb' ? w.v * LB_PER_KG : w.v / LB_PER_KG);
const fmtNum = n => (Math.round(n * 2) / 2).toString();      // nearest 0.5
const fmtWeight = (w, u) => !w || w.v <= 0 ? 'Body weight' : `${fmtNum(toUnit(w, u))} ${u}`;

const Patients = {
  list: [],
  exercise: store.get('exercise', 0),
  unit: store.get('unit', 'lb'),
  sessionStart: new Date(),
  onExerciseChange: mode => {},          // TODO: send "M<mode>" to every device once the link exists
  add(id, name, age, weights) {
    const saved = store.get('patient.' + id, null);
    this.list.push({
      id, name: saved?.name ?? name, age: saved?.age ?? age,
      weights: saved?.weights ?? weights ?? [{ v: 0, u: 'lb' }, { v: 0, u: 'lb' }],
      bpm: 0, reps: 0, lastSeen: 0,
      // session stats
      sets: [],                 // { ex, reps, weight }
      cur: null,                // open set: { ex, startReps, lastRepAt }
      hrSum: 0, hrN: 0, hrPeak: 0, redCount: 0, wasHigh: false
    });
  },
  get(id) { return this.list.find(p => p.id === id); },
  // sample: { bpm, reps, seq? }; seenAt: when the device last sent data (ms since epoch)
  receive(id, sample, seenAt = Date.now()) {
    const p = this.get(id); if (!p) return;
    p.lastSeen = Math.max(p.lastSeen, seenAt);
    if (sample.seq !== undefined) {                              // live: skip polls with nothing new
      if (sample.seq === p.seq) return;
      p.seq = sample.seq;
    }
    const now = Date.now();
    if (typeof sample.bpm === 'number') p.bpm = sample.bpm;
    if (typeof sample.reps === 'number') this.trackReps(p, sample.reps, now);
    if (p.bpm >= 40) {
      p.hrSum += p.bpm; p.hrN++; p.hrPeak = Math.max(p.hrPeak, p.bpm);
      const high = zone(p) === 'high';
      if (high && !p.wasHigh) p.redCount++;
      p.wasHigh = high;
    }
  },
  trackReps(p, reps, now) {
    if (reps < p.reps) { this.closeSet(p); }                       // device counter was reset
    else if (reps > p.reps) {
      if (!p.cur) p.cur = { ex: this.exercise, startReps: p.reps };
      p.cur.lastRepAt = now;
    }
    p.reps = reps;
  },
  closeSet(p) {
    if (!p.cur) return;
    const n = p.reps - p.cur.startReps;
    if (n > 0) p.sets.push({ ex: p.cur.ex, reps: n, weight: { ...p.weights[p.cur.ex] } });
    p.cur = null;
  },
  closeRestedSets(now) {
    for (const p of this.list) if (p.cur && now - p.cur.lastRepAt > CONFIG.SET_REST_MS) this.closeSet(p);
  },
  currentSetReps(p) { return p.cur ? p.reps - p.cur.startReps : 0; },
  save(p) { store.set('patient.' + p.id, { name: p.name, age: p.age, weights: p.weights }); }
};

/* ---------------------------------------------------------------------
   UI
   --------------------------------------------------------------------- */
const $ = id => document.getElementById(id);
const PENCIL = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
const DUMBBELL = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 7v10M3 9.5v5M18 7v10M21 9.5v5M6 12h12"/></svg>';
const PERSON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="2.2"/><path d="M12 8v7M8 21l4-6 4 6M7 11h10"/></svg>';

function zone(p) {
  const max = 220 - p.age;
  if (p.bpm < 40) return null;                 // still measuring / no finger
  if (p.bpm < max * ZONE_MID) return 'low';
  if (p.bpm <= max * ZONE_HIGH) return 'mid';
  return 'high';
}

function buildExerciseButtons() {
  const seg = $('exerciseSeg');
  seg.innerHTML = EXERCISES.map((e, i) => `<button data-i="${i}" aria-pressed="${i === Patients.exercise}">${e}</button>`).join('');
  seg.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    const i = +b.dataset.i; if (i === Patients.exercise) return;
    Patients.list.forEach(p => Patients.closeSet(p));
    Patients.exercise = i; store.set('exercise', i);
    seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', +x.dataset.i === i));
    Patients.onExerciseChange(i);
    toast(`Everyone switched to ${EXERCISES[i]}`);
    render();
  };
}

function buildUnitToggle() {
  const seg = $('unitSeg');
  const sync = () => {
    seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.u === Patients.unit));
    document.querySelectorAll('.uName').forEach(s => s.textContent = Patients.unit);
  };
  seg.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    Patients.unit = b.dataset.u; store.set('unit', Patients.unit); sync(); render();
  };
  sync();
}

function buildTiles() {
  if (!Patients.list.length) {
    $('grid').innerHTML = '<p class="empty">Waiting for devices. Turn on the ESP32s and make sure they are on the same WiFi as this laptop.</p>';
    return;
  }
  $('grid').innerHTML = Patients.list.map(p => `
    <article class="tile" id="t-${p.id}">
      <div class="top"><div class="who"><span class="name"></span><span class="ex"></span></div>
        <button class="edit" data-id="${p.id}" aria-label="Edit patient" title="Edit name, age and weights">${PENCIL}</button></div>
      <div class="hr"><span class="heart">♥</span><b>--</b><span>bpm</span></div>
      <div class="meter"><i></i></div>
      <div class="foot"><span class="reps"><b>0</b> <span class="rl">reps</span></span><span class="status"></span><span class="weight"></span></div>
    </article>`).join('');
  $('grid').onclick = e => { const b = e.target.closest('.edit'); if (b) openEdit(b.dataset.id); };
}

function render() {
  const now = Date.now(); let high = 0, off = 0;
  Patients.closeRestedSets(now);
  for (const p of Patients.list) {
    const t = $('t-' + p.id);
    if (!t) continue;
    const offline = now - p.lastSeen > CONFIG.NO_SIGNAL_MS;
    const z = offline ? null : zone(p);
    const setReps = Patients.currentSetReps(p);
    const w = p.weights[Patients.exercise];
    const bw = !w || w.v <= 0;
    t.classList.toggle('offline', offline);
    t.classList.toggle('high', z === 'high');
    t.style.setProperty('--zc', z ? `var(--${z})` : 'var(--off)');
    t.querySelector('.name').textContent = p.name;
    t.querySelector('.ex').textContent = EXERCISES[Patients.exercise];
    t.querySelector('.hr b').textContent = z ? Math.round(p.bpm) : '--';
    t.querySelector('.meter i').style.width = z ? Math.min(100, p.bpm / (220 - p.age) * 100) + '%' : '0';
    t.querySelector('.reps b').textContent = offline ? '–' : setReps;
    t.querySelector('.rl').textContent = setReps === 1 && !offline ? 'rep' : 'reps';
    const wEl = t.querySelector('.weight');
    wEl.className = 'weight' + (bw ? ' bw' : '');
    wEl.innerHTML = (bw ? PERSON : DUMBBELL) + `<span>${fmtWeight(w, Patients.unit)}</span>`;
    t.querySelector('.status').textContent = offline ? 'No signal' : z === 'high' ? 'HR too high' : '';
    if (offline) off++; else if (z === 'high') high++;
  }
  $('sTotal').textContent = Patients.list.length;
  $('sHigh').textContent = high;
  $('sOff').textContent = off;
}

let editing = null;
function openEdit(id) {
  editing = Patients.get(id);
  $('fName').value = editing.name; $('fAge').value = editing.age;
  $('fW0').value = fmtNum(Math.max(0, toUnit(editing.weights[0], Patients.unit)));
  $('fW1').value = fmtNum(Math.max(0, toUnit(editing.weights[1], Patients.unit)));
  $('editDlg').showModal(); $('fName').select();
}
$('fCancel').onclick = () => $('editDlg').close();
$('editForm').onsubmit = () => {
  const age = parseInt($('fAge').value, 10), name = $('fName').value.trim();
  if (!editing || !name || !(age >= 5 && age <= 110)) return;
  editing.name = name; editing.age = age;
  [0, 1].forEach(i => {
    const v = parseFloat($('fW' + i).value);
    const old = editing.weights[i];
    // keep the stored value untouched if the field still shows the same rounded number
    if (v >= 0 && fmtNum(toUnit(old, Patients.unit)) !== fmtNum(v)) editing.weights[i] = { v, u: Patients.unit };
  });
  Patients.save(editing); render();
};

let toastTimer;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------------------------------------------------------------------
   Excel export: one box per patient with their stats for this session.
   Uses the ExcelJS library (website/vendor/exceljs.min.js, works offline).
   --------------------------------------------------------------------- */
function sessionSummary(p) {
  // include the set in progress so nothing is lost if export is pressed mid-set
  const sets = p.sets.slice();
  if (p.cur && p.reps - p.cur.startReps > 0) sets.push({ ex: p.cur.ex, reps: p.reps - p.cur.startReps, weight: { ...p.weights[p.cur.ex] } });
  const byEx = EXERCISES.map((name, i) => {
    const s = sets.filter(x => x.ex === i);
    const weights = [...new Set(s.map(x => fmtWeight(x.weight, Patients.unit)))];
    return {
      name, sets: s.length, reps: s.reduce((a, x) => a + x.reps, 0),
      perSet: s.map(x => x.reps).join(', ') || '–',
      weight: weights.length ? weights.join(' / ') : fmtWeight(p.weights[i], Patients.unit)
    };
  });
  return {
    name: p.name, age: p.age,
    avgHr: p.hrN ? Math.round(p.hrSum / p.hrN) : '–',
    peakHr: p.hrN ? Math.round(p.hrPeak) : '–',
    redCount: p.redCount, byEx
  };
}

// One box per patient, laid out 3 across, built with the ExcelJS library.
async function buildWorkbook() {
  const BOX_W = 5, GAP = 1, PER_ROW = 3, BOX_H = 8;
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('Session', {
    views: [{ showGridLines: false }],
    pageSetup: { orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0 }
  });
  const widths = [13, 7, 14, 11, 14];
  for (let b = 0; b < PER_ROW; b++) {
    widths.forEach((w, k) => { ws.getColumn(1 + b * (BOX_W + GAP) + k).width = w; });
    ws.getColumn(1 + b * (BOX_W + GAP) + BOX_W).width = 3;
  }
  const thin = { style: 'thin', color: { argb: 'FFB8C2CC' } };
  const border = { top: thin, left: thin, bottom: thin, right: thin };
  const fill = argb => ({ type: 'pattern', pattern: 'solid', fgColor: { argb } });

  const d = Patients.sessionStart;
  ws.getCell(1, 1).value = `Rehab session  ${d.toLocaleDateString()} ${d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;
  ws.getCell(1, 1).font = { bold: true, size: 16 };
  ws.getCell(2, 1).value = `Exported ${new Date().toLocaleString()}  ·  weights in ${Patients.unit}`;
  ws.getCell(2, 1).font = { italic: true, size: 10, color: { argb: 'FF5D6B7A' } };

  Patients.list.forEach((p, i) => {
    const s = sessionSummary(p);
    const r0 = 4 + Math.floor(i / PER_ROW) * (BOX_H + GAP);
    const c0 = 1 + (i % PER_ROW) * (BOX_W + GAP);
    const cell = (r, c) => ws.getCell(r0 + r, c0 + c);
    for (let r = 0; r < BOX_H; r++) for (let c = 0; c < BOX_W; c++) cell(r, c).border = border;

    ws.mergeCells(r0, c0, r0, c0 + BOX_W - 1);
    cell(0, 0).value = s.name;
    cell(0, 0).font = { bold: true, size: 13, color: { argb: 'FFFFFFFF' } };
    cell(0, 0).fill = fill('FF2563EB');

    const pair = (r, c, label, value) => {
      cell(r, c).value = label; cell(r, c).font = { bold: true };
      cell(r, c + (c ? 2 : 1)).value = value;
      cell(r, c + (c ? 2 : 1)).alignment = { horizontal: 'left' };
    };
    pair(1, 0, 'Age', s.age);
    ws.mergeCells(r0 + 1, c0 + 2, r0 + 1, c0 + 3); pair(1, 2, 'Red zone alerts', s.redCount);
    pair(2, 0, 'Avg HR', s.avgHr);
    ws.mergeCells(r0 + 2, c0 + 2, r0 + 2, c0 + 3); pair(2, 2, 'Peak HR', s.peakHr);

    ['Exercise', 'Sets', 'Reps per set', 'Total reps', 'Weight'].forEach((h, k) => {
      cell(4, k).value = h; cell(4, k).font = { bold: true }; cell(4, k).fill = fill('FFE0E9FD');
    });
    s.byEx.forEach((e, k) => {
      [e.name, e.sets, e.perSet, e.reps, e.weight].forEach((v, c) => {
        cell(5 + k, c).value = v;
        cell(5 + k, c).alignment = { horizontal: 'left' };
      });
      cell(5 + k, 0).font = { bold: true };
    });
  });
  return wb.xlsx.writeBuffer();
}

$('btnExport').onclick = async () => {
  if (typeof ExcelJS === 'undefined') { toast('Excel library missing (website/vendor/exceljs.min.js)'); return; }
  const buf = await buildWorkbook();
  const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const d = Patients.sessionStart, pad = n => String(n).padStart(2, '0');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `rehab-session-${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}.xlsx`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('Session exported to Excel');
};

/* ---------------------------------------------------------------------
   Live data from server/pt_server.py
   --------------------------------------------------------------------- */
const LIVE = location.protocol.startsWith('http') && !new URLSearchParams(location.search).has('demo');

function startLive() {
  $('demoNote').textContent = 'Connecting to the session server…';
  Patients.onExerciseChange = mode => {
    fetch('/api/exercise', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ mode }) })
      .catch(() => toast('Could not reach the server'));
  };
  let first = true, failing = false;
  async function poll() {
    try {
      const r = await fetch('/api/state', { cache: 'no-store' });
      const st = await r.json();
      if (first && st.mode !== Patients.exercise) {             // follow the server's exercise on load
        Patients.exercise = st.mode;
        $('exerciseSeg').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', +x.dataset.i === st.mode));
      }
      first = false;
      let added = false;
      for (const d of st.devices) {
        if (!Patients.get(d.id)) { Patients.add(d.id, `Device ${d.id}`, 18); added = true; }
        Patients.receive(d.id, { bpm: d.bpm, reps: d.reps, seq: d.seq }, Date.now() - d.age_ms);
      }
      if (added) buildTiles();
      const n = st.devices.filter(d => d.age_ms < CONFIG.NO_SIGNAL_MS).length;
      $('demoNote').textContent = `Live · ${n} of ${st.devices.length} device${st.devices.length === 1 ? '' : 's'} sending data`;
      if (failing) toast('Reconnected to the server');
      failing = false;
    } catch {
      if (!failing) $('demoNote').textContent = 'Lost connection to the session server. Is pt_server.py still running?';
      failing = true;
    }
    render();
    setTimeout(poll, 500);
  }
  poll();
}

/* ---------------------------------------------------------------------
   Demo data (used when the page is opened as a file or with ?demo)
   24 patients sending the same line format as the Arduino. Each does a set
   of 8-12 reps then rests. One patient's heart rate climbs into the red
   zone now and then, and one drops out.
   --------------------------------------------------------------------- */
function startDemo() {
const DEMO_NAMES = ['Amira K.', 'Ben T.', 'Carla M.', 'Dev P.', 'Elena R.', 'Farid H.', 'Grace L.', 'Hiro S.',
  'Isla W.', 'Jonah B.', 'Kavya N.', 'Liam O.', 'Maya C.', 'Noah D.', 'Olivia F.', 'Pedro G.',
  'Quinn A.', 'Rosa V.', 'Sam J.', 'Tara E.', 'Umar Y.', 'Vera Z.', 'Wes I.', 'Xin Q.'];
const demo = DEMO_NAMES.map((name, i) => ({
  id: 'p' + (i + 1), name, age: 20 + ((i * 7) % 45),
  weights: [{ v: i % 4 === 0 ? 0 : 10 + (i * 5) % 40, u: 'lb' }, { v: i % 6 === 3 ? 0 : 5 + (i * 2.5) % 20, u: 'lb' }],
  base: 72 + (i * 5) % 30, reps: 0, phase: Math.random(), period: 2.6 + (i % 5) * 0.4,
  setTarget: 8 + (i % 5), inSet: 0, restLeft: Math.random() * 6
}));
demo.forEach(d => Patients.add(d.id, d.name, d.age, d.weights));

const DEMO = { restS: 25 };
let demoT = 0;
setInterval(() => {
  demoT += 0.5;
  demo.forEach((d, i) => {
    if (i === 9 && demoT % 40 > 30) return;                      // patient 10 stops sending for 10 s every 40 s
    if (d.restLeft > 0) d.restLeft -= 0.5;
    else {
      d.phase += 0.5 / d.period;
      if (d.phase >= 1) {
        d.phase -= 1; d.reps++; d.inSet++;
        if (d.inSet >= d.setTarget) { d.inSet = 0; d.restLeft = DEMO.restS; }
      }
    }
    let bpm = d.base + Math.min(25, demoT / 8) + Math.sin(demoT / 6 + i) * 4;
    if (i === 4) bpm += 45 * Math.max(0, Math.sin(demoT / 12));  // patient 5 spikes into the red zone
    Patients.receive(d.id, { bpm, reps: d.reps });
  });
}, 500);
Patients.onExerciseChange = () => demo.forEach(d => { d.reps = 0; d.inSet = 0; });
}

/* --------------------------------------------------------------------- */
if (LIVE) startLive(); else startDemo();
buildExerciseButtons();
buildUnitToggle();
buildTiles();
render();
setInterval(render, 500);
</script>
