; PT Aid on an ESP32 DevKit V1 (ESP-WROOM-32)
; Port of heart_rate_monitor/heart_rate_monitor.ino (the Uno R4 sketch, left as is).
;
; Build:   pio run
; Upload:  pio run -t upload        (hold BOOT if the upload stalls at "Connecting...")
; Monitor: pio device monitor

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = COM5     ; ESP32 (CP2102). COM4 is a Bluetooth port, don't use it
monitor_port = COM5
lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2


